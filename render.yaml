# Render Blueprint for the Garden Fairy order & payment API.
#
# Use it from the Render Dashboard ("New +" -> "Blueprint") and pick this
# repository. Values marked `sync: false` are prompted for when the
# blueprint is applied; `generateValue: true` variables get a random value
# once and keep it across deploys.
#
# Spec docs: https://render.com/docs/blueprint-spec
#
# Note: environment variables set on the service always win over the
# fallbacks committed in config/.env.production.

services:
  - type: web
    name: garden-fairy-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      # --- Database (required) ---
      - key: MONGO_URI
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # --- CORS (comma-separated frontend origins) ---
      - key: CORS_ORIGIN
        sync: false

      # --- Payments (Flutterwave) ---
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_REDIRECT_URL
        sync: false
      - key: FLW_WEBHOOK_SECRET
        generateValue: true
      - key: FLW_BASE_URL
        value: https://api.flutterwave.com/v3

      # --- Uploads (Cloudinary) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
